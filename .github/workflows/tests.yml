name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker-integration:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config
      - name: Build and start full pipeline
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in {1..40}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Verify MQTT events reach PostgreSQL
        run: |
          sleep 12
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://localhost:8000/analytics/summary") as response:
              data = json.load(response)

          print(data)
          assert data["events_stored"] > 0, "No MQTT sensor events reached PostgreSQL"
          assert data["active_devices"] == 10
          PY
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Tear down stack
        if: always()
        run: docker compose down -v
